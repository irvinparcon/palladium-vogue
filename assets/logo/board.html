<!doctype html><html><head><meta charset="utf-8"><title>PV Logo Concepts</title>
<style>
body{margin:0;background:#0B0B0D;color:#F5F3EF;font:300 13px/1.6 Inter,system-ui,sans-serif;padding:40px}
h2{font:400 11px/1 Inter,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#C6A86A;margin:40px 0 18px}
.row{display:grid;grid-template-columns:240px 240px 1fr;gap:16px}
.c{border:1px solid rgba(198,168,106,.22);display:grid;place-items:center;padding:24px;min-height:240px}
.c img{max-width:100%;max-height:220px}.light{background:#F5F3EF}.char{background:#18181B}
.h{grid-column:1/-1;min-height:140px}.h img{max-height:100px}
.fav{display:flex;gap:18px;align-items:end}.fav img{background:#18181B;padding:4px}
</style></head><body>
<h2>01 — The Interlace</h2>
<div class="row"><div class="c"><img src="pv-interlace-monogram-gold.svg"></div><div class="c char"><img src="pv-interlace-seal-gold.svg"></div><div class="c"><img src="pv-interlace-lockup-gold.svg"></div>
<div class="c h light"><img src="pv-interlace-lockup-onyx.svg" style="max-height:180px"></div><div class="c h"><img src="pv-interlace-horizontal-gold.svg"></div></div>
<h2>02 — The Ligature</h2>
<div class="row"><div class="c"><img src="pv-ligature-monogram-gold.svg"></div><div class="c char"><img src="pv-ligature-seal-gold.svg"></div><div class="c"><img src="pv-ligature-lockup-gold.svg"></div>
<div class="c h light"><img src="pv-ligature-lockup-onyx.svg" style="max-height:180px"></div><div class="c h"><img src="pv-ligature-horizontal-gold.svg"></div></div>
<h2>Small sizes</h2>
<div class="fav"><img src="pv-interlace-seal-gold.svg" width="64"><img src="pv-interlace-monogram-gold.svg" width="32"><img src="pv-interlace-monogram-gold.svg" width="16"> &nbsp; <img src="pv-ligature-seal-gold.svg" width="64"><img src="pv-ligature-monogram-gold.svg" width="32"><img src="pv-ligature-monogram-gold.svg" width="16"></div>
</body></html>
